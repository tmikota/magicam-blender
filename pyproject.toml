[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "magicam"
version = "0.1.0"
description = "Pydantic models and tooling for TVPaint clip exports, usable natively in Blender (no PySide)."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pydantic>=2"]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
include = ["magicam*"]
